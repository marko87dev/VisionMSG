[package]
name = "visionmsg"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Lecteur de fichiers Outlook MSG pour macOS"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
rfd = "=0.16.0"
msg_parser = "=0.3.6"
html2text = "=0.17.1"
mail-builder = "=0.4.4"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
time = { version = "0.3", features = ["parsing"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }
